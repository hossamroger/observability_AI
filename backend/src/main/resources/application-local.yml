server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:mem:observability;MODE=Oracle;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
monitoring:
  collector:
    enabled: true
  demo:
    enabled: true

  elk:
    ssl-verification-enabled: false
