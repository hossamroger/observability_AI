server:
  port: 8080
spring:
  config:
    import:
      - "optional:file:./config/credentials.yml"
      - "optional:file:./backend/config/credentials.yml"
      - "optional:file:${OBS_CREDENTIALS_FILE:./backend/config/credentials.yml}"
  datasource:
    url: jdbc:h2:mem:observability;MODE=Oracle;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
monitoring:
  bigquery:
    on-demand-enabled: true
  collector:
    enabled: true
  demo:
    enabled: false

  elk:
    ssl-verification-enabled: false
