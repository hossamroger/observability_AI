spring:
  config:
    import: "optional:file:${OBS_CREDENTIALS_FILE:./config/credentials.yml}"
  datasource:
    jndi-name: java:comp/env/jdbc/DSObservabilityDS
  sql:
    init:
      mode: never
monitoring:
  demo:
    enabled: false
  # Enable only on one designated collector instance; avoid duplicate cluster collection.
  collector:
    enabled: ${OBS_COLLECTOR_ENABLED:false}
  ga4:
    enabled: ${OBS_GA4_ENABLED:false}
  dynatrace:
    enabled: ${OBS_DYNATRACE_ENABLED:false}
  elk:
    enabled: ${OBS_ELK_ENABLED:false}
