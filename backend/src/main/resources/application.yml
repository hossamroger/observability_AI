spring:
  application:
    name: observability-platform
  main:
    banner-mode: off
  profiles:
    default: local
  sql:
    init:
      mode: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
monitoring:
  collection:
    interval-ms: 30000
    dispatch-interval-ms: 1000
    worker-count: 4
    managed-executor-jndi: ${OBS_MANAGED_EXECUTOR_JNDI:java:comp/DefaultManagedExecutorService}
  collector:
    enabled: false
  demo:
    enabled: false
  ga4:
    enabled: false
    interval-ms: 60000
    property-id: ${GA4_PROPERTY_ID:}
    credentials-path: ${GA4_CREDENTIALS_PATH:}
    streams:
      web: ${GA4_WEB_STREAM_ID:}
      android: ${GA4_ANDROID_STREAM_ID:}
      ios: ${GA4_IOS_STREAM_ID:}
  bigquery:
    enabled: false
    project-id: ${BIGQUERY_PROJECT_ID:}
    dataset-id: ${BIGQUERY_DATASET_ID:}
    location: ${BIGQUERY_LOCATION:}
    credentials-path: ${BIGQUERY_CREDENTIALS_PATH:}
    property-timezone: ${BIGQUERY_PROPERTY_TIMEZONE:Asia/Dubai}
    interval-ms: 300000
    maximum-bytes-billed: 1073741824
    lag-seconds: 120
    home-screen-name: ${BIGQUERY_HOME_SCREEN_NAME:home_page}
  dynatrace:
    enabled: false
    url: ${DYNATRACE_URL:}
    api-token: ${DYNATRACE_TOKEN:}
    metric-selector: ${DYNATRACE_METRIC_SELECTOR:}
    additional-metric-selectors: ${DYNATRACE_ADDITIONAL_METRIC_SELECTORS:builtin:service.response.time:percentile(50),builtin:service.response.time:percentile(99),builtin:service.requestCount.total:value,builtin:service.errors.total.rate:avg}
    entity-cache-seconds: 900
  elk:
    enabled: false
    ssl-verification-enabled: true
    url: ${ELASTICSEARCH_URL:}
    api-key: ${ELASTICSEARCH_API_KEY:}
    index-pattern: ${ELASTICSEARCH_INDEX_PATTERN:logs-*}
    level-field: ${ELASTICSEARCH_LEVEL_FIELD:log.level}
    error-value: ${ELASTICSEARCH_ERROR_VALUE:ERROR}
